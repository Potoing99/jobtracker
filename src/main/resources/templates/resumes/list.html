<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <title>이력서</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
<div th:replace="fragments/header :: appHeader"></div>
<h1>이력서</h1>

<!-- 상단 배너 (톤 통일) -->
<div class="banner-elevated" role="region" aria-labelledby="resumeBannerTitle">
  <div class="banner-head">
    <div class="title-wrap">
      <span id="resumeBannerTitle" class="banner-title">이력서 관리</span>
      <span class="banner-hint">PDF/Word 업로드 · 검색 · 정렬 · 페이징</span>
      <span class="banner-hint"
            th:text="|총 ${page.totalElements}개의 이력서|">
      </span>
    </div>
    <div class="banner-actions">
      <a class="btn-ghost" th:href="@{/resumes}">전체 보기</a>
      <a class="btn-primary" th:href="@{/resumes/new}">업로드</a>
    </div>
  </div>
</div>

<!-- 검색/정렬/페이지크기 -->
<form th:action="@{/resumes}" method="get" style="margin-bottom:12px;">
  <input type="text" name="q" placeholder="제목/파일명 검색" th:value="${q}">
  <input type="hidden" name="page" value="0"><!-- 변경 시 1페이지로 -->
  <select name="sort" th:value="${sort}">
    <option value="dateDesc" th:selected="${sort == 'dateDesc'}">업로드 최신순</option>
    <option value="dateAsc"  th:selected="${sort == 'dateAsc'}">업로드 오래된순</option>
    <option value="titleAsc" th:selected="${sort == 'titleAsc'}">제목 오름차순</option>
    <option value="titleDesc" th:selected="${sort == 'titleDesc'}">제목 내림차순</option>
    <option value="sizeAsc"  th:selected="${sort == 'sizeAsc'}">파일 크기 작은순</option>
    <option value="sizeDesc" th:selected="${sort == 'sizeDesc'}">파일 크기 큰순</option>
  </select>
  <select name="size" th:value="${size}">
    <option value="10" th:selected="${size == 10}">10개</option>
    <option value="20" th:selected="${size == 20}">20개</option>
    <option value="50" th:selected="${size == 50}">50개</option>
  </select>
  <button type="submit">검색</button>
  <a class="btn" th:href="@{/applications}" style="margin-left:8px;">지원현황</a>
</form>

<!-- 빈 상태 -->
<div th:if="${page == null or page.totalElements == 0}" class="empty">
  이력서가 없습니다. 상단 ‘업로드’를 눌러 추가하세요.
</div>

<!-- 목록 -->
<table th:if="${page != null and page.totalElements > 0}">
  <thead>
  <tr>
    <th class="tl" style="width:36%">제목</th>
    <th class="tl" style="width:28%">파일명</th>
    <th class="tc" style="width:18%">업로드일</th>
    <th class="tr" style="width:10%">크기</th>
    <th class="tc" style="width:8%">다운로드/삭제</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="r : ${page.content}">
    <td class="tl" th:text="${r.title}">Backend 이력서</td>
    <td class="tl" th:text="${r.originalFilename}">resume.pdf</td>
    <td class="tc" th:text="${#temporals.format(r.uploadedAt,'yyyy-MM-dd HH:mm')}">2025-10-28</td>
    <td class="tr" th:text="${#numbers.formatInteger((r.size != null ? r.size : 0)/1024,0)} + ' KB'">512 KB</td>
    <td class="tc actions">
      <a class="btn" th:href="@{|/resumes/${r.id}/download|}">다운</a>
      <form th:action="@{|/resumes/${r.id}/delete|}" method="post"
            style="display:inline" onsubmit="return confirm('삭제하시겠어요?');">
        <input type="hidden" th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button class="btn-ghost" type="submit">삭제</button>
      </form>
    </td>
  </tr>
  </tbody>
</table>

<!-- 페이저 (Interview/Applications와 동일 구조/클래스) -->
<nav class="pager-wrap" th:if="${page != null and page.totalPages > 0}" aria-label="Resumes pagination">
  <ul class="pager">
    <li class="page-item" th:classappend="${page.first} ? ' disabled'">
      <a class="page-link" th:href="@{/resumes(page=0, size=${size}, q=${q}, sort=${sort})}" aria-label="첫 페이지">«</a>
    </li>
    <li class="page-item" th:classappend="${page.first} ? ' disabled'">
      <a class="page-link" th:href="@{/resumes(page=${page.number - 1}, size=${size}, q=${q}, sort=${sort})}" aria-label="이전">‹</a>
    </li>

    <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
        th:classappend="${i == page.number} ? ' active'">
      <a class="page-link" th:if="${i != page.number}"
         th:href="@{/resumes(page=${i}, size=${size}, q=${q}, sort=${sort})}"
         th:text="${i + 1}">1</a>
      <span class="page-link" th:if="${i == page.number}" th:text="${i + 1}">1</span>
    </li>

    <li class="page-item" th:classappend="${page.last} ? ' disabled'">
      <a class="page-link" th:href="@{/resumes(page=${page.number + 1}, size=${size}, q=${q}, sort=${sort})}" aria-label="다음">›</a>
    </li>
    <li class="page-item" th:classappend="${page.last} ? ' disabled'">
      <a class="page-link" th:href="@{/resumes(page=${page.totalPages - 1}, size=${size}, q=${q}, sort=${sort})}" aria-label="마지막 페이지">»</a>
    </li>
  </ul>

  <div class="pager-meta">
    <strong th:text="${page.number + 1}">1</strong>/<span th:text="${page.totalPages}">1</span>
  </div>
</nav>
</body>
</html>
