<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이력서 업로드</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<h1>이력서 업로드</h1>

<div class="card">
  <div class="card-body">
    <form th:action="@{/resumes}" method="post" enctype="multipart/form-data" class="form-grid">
      <input type="hidden" th:if="${_csrf != null}"
             th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="form-row">
        <label for="title">제목</label>
        <input id="title" name="title" type="text" required maxlength="120"
               placeholder="예) 국문_백엔드_2025_v3"/>
      </div>

      <div class="form-row">
        <label for="file">파일</label>
        <input id="file" name="file" type="file" accept=".pdf,.doc,.docx" required/>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">업로드</button>
        <a class="btn" th:href="@{/resumes}">목록</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
