<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인 - JobTracker</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
  <style>
    .auth-container {
      max-width: 420px;
      margin: 48px auto 0 auto;
    }
    .auth-title {
      margin-bottom: 16px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .form-input {
      width: 100%;
      padding: 8px 10px;
      box-sizing: border-box;
    }
    .form-actions {
      margin-top: 20px;
      margin-bottom: 4px;
    }
    .btn-block {
      width: 100%;
      display: inline-block;
      text-align: center;
    }
    .alert {
      margin-top: 8px;
      margin-bottom: 8px;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .alert-error {
      background: #ffe5e5;
      border: 1px solid #e06666;
    }
    .alert-success {
      background: #e6ffed;
      border: 1px solid #5cb85c;
    }

    /* ⬇⬇ 여기만 변경: 윗줄이랑 간격 좀 더 + 살짝 위 테두리 */
    .auth-footer {
      margin-top: 18px;         /* 원래 10 → 18로 증가 */
      padding-top: 8px;
      border-top: 1px solid #f2f2f2;
      font-size: 0.9rem;
      text-align: right;
    }
    .auth-footer a {
      text-decoration: none;
      margin-left: 8px;
      /* 버튼 느낌 살짝 */
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #ddd;
      background: #fff;
      color: #333;
      font-size: 0.9rem;
    }
    .auth-footer a:hover {
      background: #f7f7f7;
    }
  </style>
</head>
<body>

<div class="auth-container">
  <h1 class="auth-title">로그인</h1>

  <div class="card">
    <div class="card-body">
      <form th:action="@{/login}" method="post">

        <input type="hidden"
               th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <div class="form-group">
          <label for="email" class="form-label">이메일</label>
          <input type="text"
                 id="email"
                 name="email"
                 class="form-input"
                 placeholder="you@example.com"
                 required
                 autofocus>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">비밀번호</label>
          <input type="password"
                 id="password"
                 name="password"
                 class="form-input"
                 placeholder="비밀번호를 입력하세요"
                 required>
        </div>

        <div th:if="${param.error}" class="alert alert-error">
          로그인에 실패했습니다. 이메일 또는 비밀번호를 확인하세요.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
          안전하게 로그아웃되었습니다.
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block">
            로그인
          </button>
        </div>
      </form>

      <div class="auth-footer">
        아직 계정이 없으신가요?
        <a th:href="@{/register/form}">회원가입</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
