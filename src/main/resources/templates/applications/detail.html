<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>지원 상세</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
  <!-- 기본 카드 -->
  <div class="card">
    <div class="card-header">
      <h1 class="card-title" th:text="${app.company} + ' / ' + ${app.position}">지원 상세</h1>
      <div>
        <span th:class="'badge badge-' + ${#strings.toLowerCase(app.status)}"
              th:text="${app.status}">APPLIED</span>
        <span class="chip" th:if="${dday != null}" th:text="${dday}" style="margin-left:8px;">D-3</span>
      </div>
    </div>

    <div class="card-body">
      <dl class="meta-grid">
        <dt>회사명</dt>
        <dd th:text="${app.company}">-</dd>

        <dt>지원분야</dt>
        <dd th:text="${app.position}">-</dd>

        <dt>지원일</dt>
        <dd th:text="${app.appliedAt} ?: '-'">-</dd>

        <dt>마감일</dt>
        <dd th:text="${app.dueDate} ?: '-'">-</dd>

        <dt>상태</dt>
        <dd th:text="${app.status}">-</dd>
      </dl>
    </div>

    <div class="card-footer">
      <div class="form-actions">
        <a class="btn btn-primary" th:href="@{|/applications/${app.id}/edit|}">수정</a>
        <form th:action="@{|/applications/${app.id}/delete|}" method="post" style="display:inline;">
          <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button class="btn" type="submit" onclick="return confirm('삭제하시겠습니까?');">삭제</button>
        </form>
        <a class="btn" th:href="@{/applications}">목록</a>
      </div>
    </div>
  </div>

  <!-- 이력서 카드 -->
  <div class="card mt-3">
    <div class="card-header">이력서</div>
    <div class="card-body">
      <div th:if="${resume != null}">
        <div class="meta-grid">
          <div>제목</div>
          <div th:text="${resume.title}">-</div>
          <div>파일명</div>
          <div th:text="${resume.originalFilename}">-</div>
          <div>업로드일</div>
          <div th:text="${#temporals.format(resume.uploadedAt, 'yyyy-MM-dd HH:mm')}">-</div>
          <div>크기</div>
          <div th:text="${#numbers.formatInteger(resume.size/1024, 0)} + ' KB'">-</div>
        </div>
        <div class="mt-2">
          <a class="btn btn-outline-primary btn-sm" th:href="@{|/resumes/${resume.id}/download|}">다운로드</a>
          <a class="btn btn-outline-secondary btn-sm" th:href="@{|/applications/${app.id}/edit|}">다른 이력서로 변경</a>
        </div>
      </div>

      <div th:if="${resume == null}">
        <p class="text-muted mb-2">연결된 이력서가 없습니다.</p>
        <a class="btn btn-primary btn-sm" th:href="@{|/applications/${app.id}/edit|}">이력서 연결하기</a>
      </div>
    </div>
  </div>

  <!-- ★ 면접 카드 (이 지원건에 연결된 면접만 표시) -->
  <div class="card mt-3">
    <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
      <span>면접</span>
      <!-- 등록 버튼은 이곳 ‘한 군데’만 -->
      <a class="btn btn-primary btn-sm" th:href="@{|/interviews/new?applicationId=${app.id}|}">면접 등록</a>
    </div>

    <div class="card-body">
      <table>
        <thead>
        <tr>
          <th class="tc">일시</th>
          <th class="tc">D-Day</th>
          <th class="tl">유형</th>
          <th class="tl">형태</th>
          <th class="tl">장소</th>
          <th class="tr actions">액션</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="i : ${interviews}">
          <td class="tc" th:text="${#temporals.format(i.scheduledAt,'yyyy-MM-dd HH:mm')}">2025-11-01 10:00</td>
          <!-- ★ 유틸을 템플릿에서 바로 호출 -->
          <td class="tc"
              th:text="${T(com.capstone.jobtracker.util.DDay).label(i.scheduledAt != null ? i.scheduledAt.toLocalDate() : null)}">D-3</td>
          <td class="tl" th:text="${i.type}">1차</td>
          <td class="tl" th:text="${i.mode}">대면</td>
          <td class="tl">
            <span th:text="${i.placeOrLink} ?: '-'">-</span>
            <div class="mt-2" th:if="${i.placeOrLink}">
              <a class="btn btn-outline-primary btn-sm"
                 th:href="@{|https://www.google.com/maps/search/?api=1&query=${#uris.escapeQueryParam(i.placeOrLink)}|}"
                 target="_blank" rel="noopener">구글</a>
              <a class="btn btn-outline-secondary btn-sm"
                 th:href="@{|https://map.naver.com/p/search/${#uris.escapePath(i.placeOrLink)}|}"
                 target="_blank" rel="noopener">네이버</a>
            </div>
          </td>
          <td class="tr actions">
            <a class="btn" th:href="@{|/interviews/${i.id}|}">상세</a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(interviews)}">
          <td class="tc" colspan="6">연결된 면접이 없습니다.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
