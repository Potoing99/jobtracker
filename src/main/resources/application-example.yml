spring:
  datasource:
    url: jdbc:mysql://localhost:3306/jobtracker?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 여기에_본인_DB_비밀번호

  jpa:
    hibernate:
      ddl-auto: update   # 개발 중엔 update, 운영할 땐 validate/release
    properties:
      hibernate:
        format_sql: true
    show-sql: true   # 실행되는 SQL 콘솔에 출력

server:
  port: 8090